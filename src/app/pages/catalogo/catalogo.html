<h1>Catálogo</h1>

<div class="cuadricula">
  @for (p of productos(); track p.id) {
    <div class="tarjeta">
      <div class="foto">
        @if (p.imagen) {
          <img [src]="p.imagen" [alt]="p.nombre" />
        }
        <div class="etiquetas">
          @if (p.nuevo) {
            <span class="etiqueta etiqueta-nuevo">Nuevo</span>
          }
          @if (p.precioOferta !== null) {
            <span class="etiqueta etiqueta-oferta">-{{ p.descuento }}%</span>
          }
        </div>
      </div>
      <h2>{{ p.nombre }}</h2>
      @if (p.precioOferta !== null) {
        <p>
          <span class="precio-viejo">${{ p.precio }}</span>
          <span class="precio-oferta">${{ p.precioOferta }}</span>
        </p>
      } @else {
        <p>${{ p.precio }}</p>
      }
    </div>
  }
</div>
